# Сборка роликов ibook на сервере GitHub. Бесплатно: 2000 минут в месяц, а один
# ролик собирается около трёх минут - это больше шестисот роликов. Компьютер
# владельца при этом может быть выключен.
#
# Кадры и клипы в репозиторий НЕ кладём: склад весит 2.7 ГБ, столько репозиторий
# не держит. Они лежат в релизе - там бесплатно и до 2 ГБ на файл.
name: Ролики ibook

on:
  workflow_dispatch:
    inputs:
      yazyk:
        description: "язык: kk uk zh en de es fr ru uz tr it rf"
        default: "kk"
      nedeli:
        description: "недели через пробел, или god - весь год"
        default: "31 32 33 34 35"
      peresborka:
        description: "1 - собрать заново уже готовое и НЕ слать в каналы"
        default: "0"
  schedule:
    # Пока работаем только на двух языках: владелец сказал сначала принять
    # казахский и русский, остальные девять ждут его слова. Раньше здесь
    # стояло семь ночей подряд, и каждая слала в канал то, чего он не смотрел.
    - cron: "0 1 * * 1"     # понедельник - казахский
    - cron: "0 1 * * 2"     # вторник - русский для Казахстана

jobs:
  sobrat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Право на запись нужно, чтобы вернуть в репозиторий список отправленного:
    # без него следующий запуск снова не знает, что уже в канале.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Поставить ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить голос и зависимости
        run: |
          pip install -q piper-tts requests httpx pillow onnxruntime unicode-rbnf sentence-stream
          # Немецкий говорит Qwen: у Piper нормального женского немецкого нет.
          # Ставим только для него - остальным языкам эти полгигабайта ни к чему.
          case "${{ github.event.inputs.yazyk }}" in de|zh)
            pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            pip install -q soundfile qwen-tts ;;
          esac
          # Узбекский идёт голосом Microsoft: ни Piper, ни Qwen, ни ElevenLabs
          # его не знают. Пакет крошечный, качается за секунды, модель не
          # скачивается вовсе - синтез идёт по сети.
          case "${{ github.event.inputs.yazyk }}" in uz)
            pip install -q edge-tts ;;
          esac

      # Голоса и склад тянем из релиза: репозиторий их не выдержит, а в релизе
      # они лежат бесплатно и качаются за минуту.
      - name: Забрать голоса и склад
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download sklad -D assets --clobber || echo "релиза ещё нет"
          ls -la assets || true

      # Голоса Piper нужны языкам без готовой озвучки. Качаются с открытого
      # склада, весят мегабайты, ставятся за секунды.
      - name: Забрать голоса Piper
        run: |
          mkdir -p "$HOME/uk-tts"
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main
          case "${{ github.event.inputs.yazyk || 'kk' }}" in
            kk) P=kk/kk_KZ/issai/high/kk_KZ-issai-high ;;
            uk) P=uk/uk_UA/tetiana/high/uk_UA-tetiana-high ;;
            zh) P=zh/zh_CN/chaowen/medium/zh_CN-chaowen-medium ;;
            en) P=en/en_US/hfc_female/medium/en_US-hfc_female-medium ;;
            de) P=de/de_DE/thorsten/high/de_DE-thorsten-high ;;
            fr) P=fr/fr_FR/siwis/medium/fr_FR-siwis-medium ;;
            es) P=es/es_MX/claude/high/es_MX-claude-high ;;
            *)  P="" ;;
          esac
          if [ -n "$P" ]; then
            N=$(basename "$P")
            curl -sL -o "$HOME/uk-tts/$N.onnx" "$B/$P.onnx"
            curl -sL -o "$HOME/uk-tts/$N.onnx.json" "$B/$P.onnx.json"
            ls -la "$HOME/uk-tts"
          fi

      - name: Собрать ролики
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          # Ключи надо ПЕРЕДАТЬ шагу, а не просто положить в секреты: без этого
          # сток отвечал «401 Unauthorized», хотя ключ в репозитории был.
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          EL_KEY: ${{ secrets.EL_KEY }}
          # При запуске по расписанию язык выбирается по дню недели.
          YAZYK: ${{ github.event.inputs.yazyk || '' }}
          # По расписанию берём ВЕСЬ год: список отправленного не даст собрать
          # то, что уже в канале, значит запуск сам доделывает недостающее.
          # Раньше тут стояли жёстко недели августа - и ночь за ночью сервер
          # пересобирал одни и те же пятнадцать роликов.
          NEDELI: ${{ github.event.inputs.nedeli || 'god' }}
          PERESBORKA: ${{ github.event.inputs.peresborka || '0' }}
          NE_SLAT: ${{ github.event.inputs.peresborka || '0' }}
        run: python server_sborka.py

      # Список отправленного возвращаем в репозиторий. Прогоны идут параллельно,
      # поэтому перед push подтягиваем чужие изменения и пробуем ещё раз.
      - name: Запомнить, что ушло в каналы
        if: always()
        run: |
          git config user.name "ibook-bot"
          git config user.email "bot@ibook.digital"
          # Параллельные потоки пишут В ОДИН файл. Раньше каждый клал свой
          # список поверх чужого: сто пятьдесят шесть роликов ушло в канал, а в
          # учёте осталась пятьдесят одна запись, и следующий запуск собрал бы
          # сто пять из них заново. Теперь свой список СКЛАДЫВАЕМ с серверным.
          cp otpravleno.json moe.json
          # Свою копию сохранили - теперь возвращаем файл к состоянию из
          # репозитория. Без этого «git checkout -B» отказывается переключать
          # ветку: движок только что дописал в этот же файл, и git видит
          # незакоммиченные правки. Два немецких потока упали ровно здесь,
          # уже ПОСЛЕ того, как отправили сто пять роликов в канал.
          git checkout -- otpravleno.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            # Каждая попытка начинается ЗАНОВО от свежего состояния сервера,
            # поэтому расхождения веток не возникает и повтор всегда возможен.
            git fetch -q origin main
            git checkout -q -B zapis origin/main
            python uchet.py slit moe.json
            git add otpravleno.json
            git diff --cached --quiet && echo "нового нет" && exit 0
            git commit -q -m "Отправлено в каналы: ${{ github.event.inputs.yazyk || 'по расписанию' }}"
            git push -q origin zapis:main && echo "записано" && exit 0
            sleep $((i * 7))
          done
          echo "не удалось записать список - следующий запуск может продублировать"

      - name: Сохранить готовое
        uses: actions/upload-artifact@v4
        with:
          name: roliki
          path: out/*.mp4
          # 90 дней, а не 7. На семи днях немецкий и китайский год
          # стёрлись раньше, чем я успел снять копию на диск.
          retention-days: 90
