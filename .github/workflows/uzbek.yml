# Узбекский голос: подбор напора и эмоции на сервере.
#
# Узбекского нет ни у Piper, ни у Qwen, ни у обычного Chatterbox. Есть одна
# подходящая модель: Chatterbox, дообученный на тридцати часах узбекской
# начитки. Лицензия MIT, унаследована от базового Chatterbox, коммерция
# разрешена. Всё остальное отпало по лицензии:
#
#   Sayro           требует ручного одобрения, права на коммерцию неясны
#   MMS от Facebook CC-BY-NC, коммерция запрещена
#   OmniVoice       веса CC-BY-NC по той же причине
#   TurkicTTS       Apache 2.0, но говорит казахским мужским голосом
#
# Эту модель владелец уже слышал раньше, на макбуке, и она его не устроила.
# С тех пор появились две вещи, которых тогда не было: чистка звука и
# понимание, что живость даёт НАПОР, а не эмоция. На немецком снижение напора
# с 0.5 до 0.3 подняло живость с 3.7 до 4.7.
#
# Узбекский - единственный из оставшихся языков, который владелец понимает
# сам. Поэтому шлём ему образцы, а не решаем за него.
name: Узбекский голос

on:
  workflow_dispatch:
    inputs:
      emocii:
        description: "эмоция через пробел"
        default: "0.5 1.0"
      napor:
        description: "напор через пробел"
        default: "0.5 0.3"
      tekst:
        description: "что сказать по-узбекски"
        default: "Yoz tugadi va birdaniga hamma shu haftada navbat olmoqchi. ibook'da mijozlaringiz o'zlari band qiladi, kechayu kunduz. 30 kun bepul."

jobs:
  uzbek:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Поставить ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Поставить движок
        run: |
          python -m pip install -q --upgrade pip
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts safetensors huggingface_hub numpy
          pip install -q "git+https://github.com/resemble-ai/chatterbox.git" 2>/dev/null || true

      - name: Забрать узбекскую модель
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download("Abduqayum/uzbek-tts-natural-speech-chatterbox",
                                allow_patterns=["*.py", "*.wav", "*.safetensors", "*.json"])
          print("модель тут:", p)
          import pathlib
          pathlib.Path("uz_put.txt").write_text(p)
          PY
          cat uz_put.txt

      - name: Перебрать настройки
        env:
          TEKST: ${{ github.event.inputs.tekst }}
          EMOCII: ${{ github.event.inputs.emocii }}
          NAPOR: ${{ github.event.inputs.napor }}
        run: |
          mkdir -p out
          # Скрипт из репозитория модели запускать нельзя: он написан под свою
          # раскладку папок и падает на «нет модуля src». Берём обычный
          # Chatterbox и подменяем в нём мозг на узбекский - веса как раз для
          # этого и выложены отдельным файлом.
          python - <<'PY'
          import os, time, itertools, torch, torchaudio
          from pathlib import Path
          from safetensors.torch import load_file
          from chatterbox.tts import ChatterboxTTS

          put = Path(open("uz_put.txt").read().strip())
          tekst = os.environ["TEKST"]
          emocii = [float(x) for x in os.environ["EMOCII"].split()]
          napory = [float(x) for x in os.environ["NAPOR"].split()]

          t0 = time.time()
          m = ChatterboxTTS.from_pretrained(device="cpu")
          print(f"базовая модель загружена за {time.time()-t0:.0f} сек", flush=True)

          sd = load_file(str(put / "t3_finetuned_merged.safetensors"))

          # У узбекской модели СВОЙ словарь: 2454 знака против 704 у базовой.
          # Они переучили не только мозг, но и азбуку - в узбекском есть oʻ, gʻ,
          # sh, ch, которых английская азбука не знает. Поэтому перед подстановкой
          # весов растягиваем два слоя под новый размер, иначе torch справедливо
          # ругается на несовпадение размеров.
          import torch.nn as nn
          n_slov, shirina = sd["text_emb.weight"].shape
          if m.t3.text_emb.weight.shape[0] != n_slov:
              print(f"словарь: было {m.t3.text_emb.weight.shape[0]}, стало {n_slov}", flush=True)
              m.t3.text_emb = nn.Embedding(n_slov, shirina)
              est_smeshchenie = getattr(m.t3.text_head, "bias", None) is not None
              m.t3.text_head = nn.Linear(shirina, n_slov, bias=est_smeshchenie)
              if hasattr(m.t3, "hp") and hasattr(m.t3.hp, "text_tokens_dict_size"):
                  m.t3.hp.text_tokens_dict_size = n_slov

          r = m.t3.load_state_dict(sd, strict=False)
          print(f"узбекские веса: не хватило {len(r.missing_keys)}, лишних {len(r.unexpected_keys)}", flush=True)
          if r.missing_keys[:3]:
              print("  первые недостающие:", r.missing_keys[:3], flush=True)

          # Азбуку тоже меняем на узбекскую, иначе модель получит номера букв
          # из английской и заговорит кашей.
          try:
              from tokenizers import Tokenizer as _Tk
              uz_tk = _Tk.from_file(str(put / "tokenizer.json"))
              if hasattr(m.tokenizer, "tokenizer"):
                  m.tokenizer.tokenizer = uz_tk
                  print("азбука заменена на узбекскую", flush=True)
              else:
                  m.tokenizer = uz_tk
                  print("азбука заменена целиком", flush=True)
          except Exception as ex:
              print("азбуку заменить не вышло:", str(ex)[:150], flush=True)

          ref = str(put / "reference_voice.wav")
          for e, n in itertools.product(emocii, napory):
              t = time.time()
              try:
                  wav = m.generate(tekst, audio_prompt_path=ref,
                                   exaggeration=e, cfg_weight=n)
                  imya = f"out/e{e}_n{n}.wav"
                  torchaudio.save(imya, wav, m.sr)
                  print(f"эмоция {e} напор {n}: готово за {time.time()-t:.0f} сек", flush=True)
              except Exception as ex:
                  import traceback; traceback.print_exc()
                  print(f"эмоция {e} напор {n}: не вышло, {str(ex)[:200]}", flush=True)
          PY
          ls -la out/ || true

      - name: Почистить, померить и прислать
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          OWNER_CHAT: "8067164700"
        run: |
          for F in out/*.wav; do
            [ -f "$F" ] || continue
            # Та же чистка, что у всех остальных языков.
            ffmpeg -y -v quiet -i "$F" \
              -af "highpass=f=70,afftdn=nf=-35:nr=20,agate=threshold=0.03:range=0.0002:ratio=9:attack=4:release=70:knee=3" \
              -ar 22050 -ac 1 "${F%.wav}_c.wav"
          done
          python - <<'PY'
          import os, sys, glob, subprocess
          sys.path.insert(0, ".")
          import proverka_golosa as P
          import send_batch as SB
          itog = []
          for f in sorted(glob.glob("out/*_c.wav")):
              w = f.replace(".wav", "_16.wav")
              subprocess.run(["ffmpeg","-y","-v","quiet","-i",f,"-ar","16000","-ac","1",w],check=False)
              m = P.mera(w, 120)
              if m:
                  itog.append((m["размах"], m["чистота"], f))
                  print(f"{os.path.basename(f):22} живость {m['размах']:.2f}  чистота {m['чистота']:.3f}  шум {m['фон']}", flush=True)
          itog.sort(reverse=True)
          print("\nэталоны: робот 2.66 | платный одобренный 4.19", flush=True)
          chat = int(os.environ.get("OWNER_CHAT", "0"))
          for zh, ch, f in itog[:3]:
              SB.send_file(chat, f, f"Узбекский. Харизма {zh:.2f} (эталон 4.19), чистота {ch:.3f}", "audio")
              print("отправлено", f, flush=True)
          PY

      - name: Сохранить
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzbek
          path: out/*.wav
          # 90 дней, а не 7. На семи днях немецкий и китайский год
          # стёрлись раньше, чем я успел снять копию на диск.
          retention-days: 90
