# Образцы голоса ПЕРЕД тем, как собирать год.
#
# Прошлый раз я запустил английский год сразу и отправил в канал 28 роликов с
# шипящим голосом. Владелец услышал это первым же ухом. Значит порядок должен
# быть обратный: сперва пара образцов лично ему, и только потом весь год.
#
# Ролики уходят В ЛИЧНЫЕ СООБЩЕНИЯ, а не в канал: канал должен оставаться
# чистым, туда попадает только принятое.
name: Образцы голоса

on:
  workflow_dispatch:
    inputs:
      yazyk:
        description: "язык"
        default: "en"
      nedelya:
        description: "какую неделю собрать"
        default: "36"
      slot:
        description: "слот A B или C"
        default: "A"
      golosa:
        description: "какие голоса сравнить, через пробел"
        default: "en_US-lessac-high en_GB-cori-high en_US-hfc_female-medium"

jobs:
  obrazcy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Поставить ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: |
          pip install -q piper-tts requests httpx pillow onnxruntime unicode-rbnf sentence-stream
          # Узбекскому нужен Chatterbox с подменёнными весами, немецкому и
          # китайскому - Qwen. Ставим только то, что нужно этому языку.
          case "${{ github.event.inputs.yazyk }}" in
            uz|tr) pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
                pip install -q chatterbox-tts safetensors huggingface_hub ;;
            de|zh|ru|rf|fr|it|es) pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
                pip install -q soundfile qwen-tts ;;
          esac

      - name: Забрать склад
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download sklad -D assets --clobber || echo "релиза ещё нет"

      - name: Забрать голоса
        run: |
          mkdir -p "$HOME/uk-tts"
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main
          # У узбекского, немецкого и китайского голос качает сам движок с
          # другого склада. Имена там не в формате Piper, и разбор пути на них
          # ломается - поэтому этот шаг для них просто пропускаем.
          case "${{ github.event.inputs.yazyk }}" in uz|tr|de|zh|ru|rf|fr|it|es) echo "голос качает движок"; exit 0 ;; esac
          for GS in ${{ github.event.inputs.golosa }}; do
            # У модели может быть несколько голосов внутри, тогда пишем «имя:номер».
            # Для скачивания номер отбрасываем: файл-то один на всех.
            G=${GS%%:*}
            [ -f "$HOME/uk-tts/$G.onnx" ] && continue
            # Из имени голоса выводим путь: en_US-lessac-high -> en/en_US/lessac/high
            L=${G%%_*}; LOC=${G%%-*}; REST=${G#*-}; NAME=${REST%-*}; Q=${REST##*-}
            curl -sL -o "$HOME/uk-tts/$G.onnx"      "$B/$L/$LOC/$NAME/$Q/$G.onnx"
            curl -sL -o "$HOME/uk-tts/$G.onnx.json" "$B/$L/$LOC/$NAME/$Q/$G.onnx.json"
            echo "$G $(du -h "$HOME/uk-tts/$G.onnx" | cut -f1)"
          done

      - name: Собрать образцы и прислать владельцу
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          EL_KEY: ${{ secrets.EL_KEY }}
          # Список чатов в репозиторий не кладём, поэтому адрес владельца
          # передаём прямо: образцы должны прийти лично ему, не в канал.
          OWNER_CHAT: "8067164700"
        run: |
          Y=${{ github.event.inputs.yazyk }}
          mkdir -p out
          export PROJECT=ibook SOURCE=year KOROTKO=1
          export WEEK=${{ github.event.inputs.nedelya }}
          export SLOT=${{ github.event.inputs.slot }}
          export LANGS_ONLY=$Y KADRY=assets/kadry KLIPY=assets/klipoteka
          # Имя переменной собираем ЗАРАНЕЕ. Запись вида VOICE_$(...)=значение
          # bash присваиванием не считает: он ищет знак равенства до подстановки,
          # не находит и принимает всю строку за имя команды. Из-за этого движок
          # в прошлый раз не запустился ни разу, а лог остался пустым.
          PEREM="VOICE_$(echo "$Y" | tr a-z A-Z)"
          # Какой движок озвучивает этот язык. Раньше здесь всегда стоял piper,
          # и узбекский с немецким молча уходили не туда.
          case "$Y" in
            uz)    DVIZHOK=uzchat ;;
            tr)    DVIZHOK=mchat ;;
            de|zh|ru|rf|fr|it|es) DVIZHOK=qwen ;;
            *)     DVIZHOK=piper ;;
          esac
          for G in ${{ github.event.inputs.golosa }}; do
            echo "=== голос $G"
            # В имени папки двоеточие не годится, заменяем на дефис.
            PAPKA=$(echo "$G" | tr ':/' '--')
            # У каждого голоса своя рабочая папка: иначе второй подберёт чужую
            # готовую озвучку и все образцы выйдут одинаковыми.
            export OUT_DIR="out/$PAPKA" WORK="out/w-$PAPKA"
            export "$PEREM=$DVIZHOK:$G"
            python reel_engine.py 2>&1 | tail -25
          done
          python - <<'PY'
          import os, glob, sys
          sys.path.insert(0, ".")
          import send_batch as SB
          chat = SB.find_chat() or int(os.environ.get("OWNER_CHAT", "0"))
          n = 0
          for d in sorted(glob.glob("out/*/")):
              golos = os.path.basename(d.rstrip("/"))
              # Рабочие папки «w-...» пропускаем. В них лежат куски сцен, и в
              # прошлый раз владелец получил три образца и пятнадцать обрывков.
              if golos.startswith("w-"):
                  continue
              for f in sorted(glob.glob(d + "*.mp4")):
                  SB.send_file(chat, f, f"Образец голоса: {golos}", "document")
                  print("отправлен", golos, os.path.basename(f), flush=True)
                  n += 1
          print("образцов отправлено:", n)
          PY

      - name: Сохранить
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obrazcy
          path: out/**/*.mp4
          retention-days: 7
